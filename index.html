<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMDB4-2 — 互動敘事地圖</title>
<style>
:root {
  --bg: #0a0a14;
  --bg2: #12121f;
  --bg3: #1a1a2e;
  --text: #e0dfe8;
  --text2: #8a889e;
  --text3: #504e68;
  --accent: #e94560;
  --accent2: #7b2d8e;
  --accent-glow: rgba(233,69,96,0.15);
  --accent2-glow: rgba(123,45,142,0.15);
  --border: #28273e;
  --card: #14142a;
  --card-hover: #1c1c36;
  --warm: #f0a500;
  --pink: #e94560;
  --tag-char: #38bdf8;
  --tag-loc: #4ade80;
  --tag-action: #f97316;
  --tag-cond: #a78bfa;
  --tag-default: rgba(255,255,255,0.06);
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  height: 100vh;
  overflow: hidden;
}
.app { display: flex; height: 100vh; flex-direction: column; }

/* === Game Banner === */
.game-banner {
  background: linear-gradient(135deg, #1a0520 0%, #120c24 40%, #0d1b2a 100%);
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.game-banner::before {
  content: '';
  position: absolute;
  top: -60%; right: -5%;
  width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(233,69,96,0.1), transparent 60%);
  pointer-events: none;
  animation: pulse-glow 6s ease-in-out infinite;
}
.game-banner::after {
  content: '';
  position: absolute;
  bottom: -40%; left: 15%;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(123,45,142,0.08), transparent 60%);
  pointer-events: none;
  animation: pulse-glow 8s ease-in-out infinite reverse;
}
@keyframes pulse-glow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.1); }
}
.banner-top { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
.banner-icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(233,69,96,0.35);
  letter-spacing: -0.5px;
}
.banner-text h1 {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.5px;
}
.banner-text .subtitle {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  margin-top: 2px;
}
.banner-stats {
  display: flex; gap: 16px; flex-wrap: wrap;
  margin-top: 12px;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  position: relative; z-index: 1;
}
.stat-item { display: flex; align-items: center; gap: 4px; }
.stat-item b { color: var(--accent); }
.char-avatars {
  display: flex; gap: 4px; margin-left: auto;
  position: relative; z-index: 1;
  flex-wrap: wrap;
}
.char-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  color: #fff;
  border: 2px solid rgba(255,255,255,0.15);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.char-avatar:hover {
  transform: scale(1.2);
  box-shadow: 0 0 12px rgba(255,255,255,0.25);
}
.char-avatar.active {
  border-color: #fff;
  box-shadow: 0 0 8px rgba(233,69,96,0.5);
}

/* === Toolbar === */
.toolbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex-shrink: 1;
  min-width: 140px;
}
.search-wrap::before {
  content: '\1F50D';
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  pointer-events: none;
  z-index: 1;
}
.search-box {
  padding: 6px 14px 6px 32px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  width: 240px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap .search-box { width: 100%; padding-left: 32px; }
.search-box:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-box::placeholder { color: var(--text3); }
.toolbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.toggle-row {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
.toggle-row input { accent-color: var(--accent); cursor: pointer; width: 14px; height: 14px; }
.toggle-row:hover { color: var(--text); }
.view-toggle { display: flex; gap: 3px; }
.view-btn {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.view-btn:hover { background: var(--bg3); color: var(--text); }
.view-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 2px 8px rgba(233,69,96,0.35);
}
.filter-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.filter-chip {
  padding: 3px 10px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.filter-chip:hover { border-color: var(--text2); color: var(--text); }
.filter-chip.active {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
}

/* === Content === */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 60px;
  scroll-behavior: smooth;
}

/* === Group Headers === */
.group-header {
  width: 100%;
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
  padding: 14px 20px;
  margin: 16px 0 4px 0;
  border-radius: var(--radius);
  position: sticky;
  top: 0; z-index: 10;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}
.group-header:first-child { margin-top: 0; }
.group-header:hover { border-color: var(--accent); }
.group-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}
.group-arrow {
  font-size: 10px;
  color: var(--text3);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.group-arrow.open { transform: rotate(90deg); }
.group-info { flex: 1; min-width: 0; }
.group-header h2 {
  font-size: 16px; font-weight: 600; color: #fff;
  margin: 0; border: none; padding: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.group-header .group-name-en {
  font-size: 11px; color: var(--text3); margin-top: 1px;
}
.group-header .group-stats {
  font-size: 11px; color: var(--text2); flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
}
.group-header .group-stats b { color: var(--accent); }
.group-body { display: none; padding: 2px 0; }
.group-body.open { display: block; }

/* === Passage Cards === */
.passage {
  background: var(--card);
  padding: 14px 18px;
  margin: 4px 0;
  border-radius: 8px;
  border-left: 3px solid transparent;
  transition: all 0.2s;
  position: relative;
}
.passage:hover {
  border-left-color: var(--accent);
  background: var(--card-hover);
}
.passage-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.passage-title {
  font-size: 13px; font-weight: 600;
  color: var(--accent);
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.passage .pid {
  font-size: 10px; color: var(--text3);
  font-family: 'Consolas', monospace; flex-shrink: 0;
}
.passage .tag-row { margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 3px; }
.passage .tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 500;
}
.tag-char { background: rgba(56,189,248,0.12); color: var(--tag-char); }
.tag-loc { background: rgba(74,222,128,0.12); color: var(--tag-loc); }
.tag-action { background: rgba(249,115,22,0.12); color: var(--tag-action); }
.tag-cond { background: rgba(167,139,250,0.12); color: var(--tag-cond); }
.tag-default { background: rgba(255,255,255,0.06); color: var(--text2); }
.char-pills { margin-bottom: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.char-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px; font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s;
}
.char-pill:hover { transform: scale(1.05); }
.passage .text {
  font-size: 14px; line-height: 1.85;
  color: var(--text);
  white-space: pre-wrap; word-break: break-word;
}
.passage .text .speaker {
  font-weight: 600;
  margin-right: 4px;
}
.passage .text-en {
  font-size: 12px; color: var(--text2);
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-style: italic; line-height: 1.6;
  white-space: pre-wrap;
  max-height: 120px; overflow: hidden;
  position: relative;
}
.passage .text-en.collapsed::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(transparent, var(--card));
  pointer-events: none;
}
.passage .choices-row {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 4px;
}
.choice-btn {
  padding: 3px 10px;
  border-radius: 14px;
  background: var(--accent-glow);
  border: 1px solid rgba(233,69,96,0.25);
  color: var(--accent);
  font-size: 11px;
  cursor: default;
  transition: all 0.15s;
}

/* === Character View === */
.char-section {
  margin: 12px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.char-section-header {
  padding: 14px 18px;
  background: var(--bg2);
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; user-select: none;
  transition: background 0.15s;
}
.char-section-header:hover { background: var(--bg3); }
.char-section-avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.char-section-info { flex: 1; min-width: 0; }
.char-section-info h3 {
  font-size: 16px; font-weight: 600; color: #fff;
}
.char-section-info .meta {
  font-size: 12px; color: var(--text2);
}
.char-section-body { display: none; }
.char-section-body.open { display: block; padding: 4px 8px 8px; }

/* === Scene View === */
.scene-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 6px 0;
  overflow: hidden;
  transition: border-color 0.2s;
}
.scene-card:hover { border-color: var(--accent); }
.scene-card-header {
  padding: 12px 16px;
  cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 10px;
}
.scene-card-header .scene-title {
  flex: 1; font-size: 14px; font-weight: 600; color: var(--text);
}
.scene-card-header .scene-meta {
  font-size: 11px; color: var(--text2); flex-shrink: 0;
}
.scene-card-body { display: none; padding: 0 16px 12px; }
.scene-card-body.open { display: block; }

/* === Condition Tags === */
.cond-block {
  margin: 8px 0 4px 0;
  padding: 4px 8px;
  border-left: 2px solid var(--tag-cond);
  background: rgba(167,139,250,0.05);
  border-radius: 0 4px 4px 0;
}
.cond-label {
  font-size: 10px;
  color: var(--tag-cond);
  font-family: 'Consolas', monospace;
  margin-bottom: 2px;
}

/* === States === */
.loading {
  text-align: center; padding: 80px 20px; color: var(--text2);
}
.loading .spinner {
  display: inline-block;
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text2); font-size: 14px;
}

/* === Scrollbar === */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* === Keyboard shortcut hint === */
.kb-hint {
  position: fixed; bottom: 12px; right: 16px;
  font-size: 10px; color: var(--text3);
  pointer-events: none; z-index: 100;
}
.kb-hint kbd {
  padding: 1px 4px; border-radius: 3px;
  background: var(--bg2); border: 1px solid var(--border);
  font-family: inherit;
}

/* === Mobile === */
@media (max-width: 768px) {
  .game-banner { padding: 16px; }
  .banner-text h1 { font-size: 20px; }
  .char-avatars { display: none; }
  .content { padding: 10px 12px 40px; }
  .passage .text { font-size: 15px; line-height: 1.9; }
  .toolbar { padding: 6px 10px; gap: 6px; }
  .search-wrap { width: 100%; }
  .search-box { width: 100%; }
  .toolbar-right { margin-left: 0; width: 100%; flex-wrap: wrap; justify-content: center; }
  .view-toggle { width: 100%; justify-content: center; }
  .filter-row { width: 100%; justify-content: center; }
  .group-header { padding: 10px 14px; }
  .group-header h2 { font-size: 15px; }
  .kb-hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="game-banner">
    <div class="banner-top">
      <div class="banner-icon">NM</div>
      <div class="banner-text">
        <h1 id="gameTitle">NMDB4-2</h1>
        <div class="subtitle" id="gameSubtitle">Twine 互動敘事 | 都市暗夜劇情</div>
      </div>
      <div class="char-avatars" id="charAvatars"></div>
    </div>
    <div class="banner-stats" id="bannerStats"></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" class="search-box" id="searchBox" placeholder="搜尋段落、角色、場景...">
    </div>
    <div class="toolbar-right">
      <label class="toggle-row">
        <input type="checkbox" id="showZh" checked>
        <span>中文</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="showEn">
        <span>英文</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="showChoices" checked>
        <span>選項</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="showCond">
        <span>條件</span>
      </label>
      <div class="view-toggle">
        <button class="view-btn active" data-view="narrative" id="viewNarrative">敘事</button>
        <button class="view-btn" data-view="scene" id="viewScene">場景</button>
        <button class="view-btn" data-view="character" id="viewChar">角色</button>
      </div>
    </div>
  </div>

  <div id="filterBar" class="toolbar" style="display:none; padding:4px 16px; border-top:none;">
    <div class="filter-row" id="filterRow"></div>
  </div>

  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>載入敘事數據中...</div>
    </div>
  </div>
</div>

<div class="kb-hint">
  <kbd>/</kbd> 搜尋 &nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切換視圖 &nbsp; <kbd>Esc</kbd> 清除
</div>

<script>
// ============================================================
// NMDB4-2 - Enhanced Narrative Viewer
// ============================================================

// === Constants ===
const CHUNK_SIZE = 60;

// Character colors — extracted from @@.name; patterns in content
const CHAR_COLORS = {
  'Maddie': '#e94560',
  'Emily': '#f0a500',
  'Matty': '#6366f1',
  'Toby': '#3b82f6',
  'Shaw': '#22c55e',
  'Venica': '#a855f7',
  'Doug': '#78716c',
  'Ritter': '#38bdf8',
  'Kara': '#ec4899',
  'Carlson': '#ef4444',
  'Rich': '#14b8a6',
  'Harlen': '#f97316',
  'Matt': '#6366f1',
  'Dave': '#84cc16',
  'Bailey': '#fb923c',
  'Nobody': '#64748b'
};

// Map @@.tag; shortcodes to display names
const CHAR_TAG_MAP = {
  'maddie': 'Maddie',
  'em': 'Emily',
  'matty': 'Matty',
  'toby': 'Toby',
  'shaw': 'Shaw',
  'venica': 'Venica',
  'doug': 'Doug',
  'ritt': 'Ritter',
  'kara': 'Kara',
  'carlson': 'Carlson',
  'rich': 'Rich',
  'harlen': 'Harlen',
  'matt': 'Matt',
  'dave': 'Dave',
  'bailey': 'Bailey',
  'nobody': 'Nobody',
  'notice': null,
  'shadow': null,
  'blur': null,
  'mattye': 'Matty'
};

// Group icons and Chinese names
const GROUP_ICONS = {
  'WP20': ['#a855f7', '\u{1F3AE}', '夜總會', 'Venica 的俱樂部'],
  '111_Apartment (30 passages)': ['#38bdf8', '\u{1F3E2}', '公寓', 'Ritter 公寓'],
  '006_AfterAnswer (6 passages)': ['#f59e0b', '\u{1F37B}', '抉擇之後', '回答後的發展'],
  'v001 (11 passages)': ['#ef4444', '\u{1F6AA}', '起點', '故事開端'],
  '715_Training (14 passages)': ['#22c55e', '\u{1F4BC}', '訓練', '酒吧工作訓練'],
  '043_Emily (9 passages)': ['#f0a500', '\u{1F467}', 'Emily 篇', 'Emily 的故事'],
  '053_Livingroom (48 passages)': ['#6366f1', '\u{1F6CB}', '客廳', '客廳場景'],
  '056_ShawSpent (10 passages)': ['#22c55e', '\u{1F525}', 'Shaw 篇', 'Shaw 的互動'],
  '093_DougHouse (16 passages)': ['#78716c', '\u{1F5A5}', 'Doug 宅', 'Doug 的住所'],
  '119_EmilyBreak (15 passages)': ['#ec4899', '\u{1F494}', 'Emily 決裂', 'Emily 的轉折']
};

// === State ===
let DATA = null;
let allCharacters = [];
let passageCharMap = new Map();
let searchQuery = '';
let showZh = true;
let showEn = false;
let showChoices = true;
let showCond = false;
let currentView = 'narrative';
let openSections = new Set();
let charFilter = null;

// === Data Loading ===
async function loadData() {
  try {
    const resp = await fetch('data/passages.json?v=' + Date.now());
    DATA = await resp.json();
    if (!DATA.meta.has_zh) {
      document.getElementById('showZh').parentElement.style.display = 'none';
      showZh = false;
      showEn = true;
      document.getElementById('showEn').checked = true;
    }
    extractCharacters();
    init();
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state">載入失敗: ' + e.message + '</div>';
  }
}

// === Character Extraction from @@.name; syntax ===
function extractCharacters() {
  const charCounts = {};
  const re = /@@\.(\w+);/g;

  DATA.passages.forEach(p => {
    const content = p.content || '';
    const chars = new Set();
    let m;
    while ((m = re.exec(content)) !== null) {
      const tag = m[1].toLowerCase();
      const name = CHAR_TAG_MAP[tag];
      if (name) chars.add(name);
    }
    re.lastIndex = 0;

    const charArray = Array.from(chars);
    passageCharMap.set(p.pid, charArray);

    charArray.forEach(c => {
      charCounts[c] = (charCounts[c] || 0) + 1;
    });
  });

  allCharacters = Object.entries(charCounts)
    .sort((a, b) => b[1] - a[1])
    .map(e => e[0]);
}

function getPassageChars(p) {
  return passageCharMap.get(p.pid) || [];
}

// === Extract choices from [[link]] syntax ===
function extractChoices(content) {
  if (!content) return [];
  const choices = [];
  const re = /\[\[([^\]|]*?)(?:\|([^\]]*?))?\]\]/g;
  let m;
  while ((m = re.exec(content)) !== null) {
    const text = m[1].trim();
    const target = (m[2] || m[1]).trim();
    if (text && text.length < 120 && !/^(INCLUDE|IF|SET)/.test(text)) {
      choices.push({ text, target });
    }
  }
  return choices;
}

// === Banner ===
function renderBanner() {
  const m = DATA.meta;
  const total = m.total || DATA.passages.length;
  const groups = (DATA.groups || []).length;
  const zhCount = m.translated_count || DATA.passages.filter(p => p.content_zh).length;
  const pct = total > 0 ? Math.round(zhCount / total * 100) : 0;
  const charCount = allCharacters.length;

  document.getElementById('bannerStats').innerHTML =
    '<span class="stat-item"><b>' + groups + '</b> 分類</span>' +
    '<span class="stat-item"><b>' + total.toLocaleString() + '</b> 段落</span>' +
    '<span class="stat-item"><b>' + charCount + '</b> 角色</span>' +
    '<span class="stat-item" style="color:' + (pct >= 95 ? '#4ade80' : '#fbbf24') + '">' + pct + '% 已翻譯</span>';

  // Character avatars in banner
  const avatarBox = document.getElementById('charAvatars');
  avatarBox.innerHTML = allCharacters.slice(0, 10).map(function(c) {
    var color = CHAR_COLORS[c] || '#64748b';
    return '<div class="char-avatar' + (charFilter === c ? ' active' : '') + '" style="background:' + color + '" title="' + c + '" onclick="filterByChar(\'' + c + '\')">' + c[0] + '</div>';
  }).join('');
}

// === Filtering ===
function getFiltered() {
  var passages = DATA.passages;
  if (charFilter) {
    passages = passages.filter(function(p) {
      return getPassageChars(p).includes(charFilter);
    });
  }
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    passages = passages.filter(function(p) {
      return (p.content_zh || '').toLowerCase().includes(q) ||
        (p.content || '').toLowerCase().includes(q) ||
        (p.name || '').toLowerCase().includes(q) ||
        (p.group || '').toLowerCase().includes(q) ||
        getPassageChars(p).some(function(c) { return c.toLowerCase().includes(q); });
    });
  }
  return passages;
}

function filterByChar(name) {
  if (charFilter === name) {
    charFilter = null;
  } else {
    charFilter = name;
  }
  updateFilterBar();
  renderBanner();
  resetAndRender();
}

function updateFilterBar() {
  var bar = document.getElementById('filterBar');
  var row = document.getElementById('filterRow');
  if (currentView === 'character' || charFilter) {
    bar.style.display = 'flex';
    row.innerHTML = allCharacters.map(function(c) {
      var color = CHAR_COLORS[c] || '#64748b';
      var active = charFilter === c ? ' active' : '';
      var style = charFilter === c ? 'background:' + color + '22;border-color:' + color + ';color:' + color : '';
      return '<button class="filter-chip' + active + '" style="' + style + '" onclick="filterByChar(\'' + c + '\')">' + c + '</button>';
    }).join('') + (charFilter ? '<button class="filter-chip" style="color:var(--warm)" onclick="charFilter=null;updateFilterBar();renderBanner();resetAndRender();">清除</button>' : '');
  } else {
    bar.style.display = 'none';
  }
}

// === Passage Title ===
function getPassageTitle(p) {
  if (p.title && p.title.length > 2 && p.title.length < 80) return p.title;
  var name = p.name || '';
  if (name && !/^(g\d|passage_|p\d|#|\d+$)/.test(name) && name.length > 2 && name.length < 80) return name;
  if (p.content_zh) {
    var first = p.content_zh.replace(/\[.*?\]/g, '').replace(/@@\.\w+;/g, '').split(/[。！？\n]/)[0].trim();
    if (first.length > 4) return first.length > 50 ? first.substring(0, 47) + '...' : first;
  }
  if (p.content) {
    var first = p.content.replace(/@@\.\w+;/g, '').replace(/<<[^>]*?>>/g, '').split(/[.!?\n]/)[0].trim();
    if (first.length > 4) return first.length > 50 ? first.substring(0, 47) + '...' : first;
  }
  return name || 'Passage ' + p.pid;
}

// === Condition Extraction ===
function extractConditions(text) {
  if (!text) return [];
  var conds = [];
  var re = /<<(?:else)?if\s+([^>]+?)>>/g;
  var m;
  while ((m = re.exec(text)) !== null) {
    conds.push(m[1].trim());
  }
  return conds;
}

// === Text Formatting ===
function formatText(s) {
  if (!s) return '';
  var text = s;
  // Strip [img] [video] markers
  text = text.replace(/\[(img|video)\]\s*/gi, '');
  // Process @@.name; dialogue markers — convert to speaker labels
  text = text.replace(/@@\.(\w+);"([^"]*?)"/g, function(_, tag, dialogue) {
    var name = CHAR_TAG_MAP[tag.toLowerCase()];
    if (name) {
      return name + '："' + dialogue + '"';
    }
    return '"' + dialogue + '"';
  });
  text = text.replace(/@@\.(\w+);/g, function(_, tag) {
    var name = CHAR_TAG_MAP[tag.toLowerCase()];
    return name ? name + '：' : '';
  });
  text = text.replace(/@@/g, '');
  // Strip Twine macros for display
  text = text.replace(/<<[^>]*?>>/g, '');
  // Strip [[link|target]] and [[link]] — keep the display text
  text = text.replace(/\[\[([^\]|]*?)(?:\|[^\]]*?)?\]\]/g, '');
  // Strip ==disabled== and [INCLUDE: ...]
  text = text.replace(/==[^=]*?==/g, '');
  text = text.replace(/\[INCLUDE:\s*[^\]]*\]/g, '');
  // Strip [OR]
  text = text.replace(/\[OR\]/g, '\n');
  // Strip \\ line continuations
  text = text.replace(/\\\\/g, '');
  // Clean excessive whitespace
  text = text.replace(/\n{3,}/g, '\n\n').trim();
  // Escape HTML
  var html = escHtml(text);
  // Paragraphs
  html = html.replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// === Tag Class ===
function tagClass(tag) {
  var t = (tag || '').toLowerCase();
  if (['action', 'fight', 'conflict'].includes(t)) return 'tag-action';
  if (['location', 'place', 'room'].includes(t)) return 'tag-loc';
  if (['story', 'dream', 'memory'].includes(t)) return 'tag-cond';
  if (['character', 'npc'].includes(t)) return 'tag-char';
  return 'tag-default';
}

// === Passage HTML ===
function passageHtml(p) {
  var title = getPassageTitle(p);
  var pid = p.pid != null ? '<span class="pid">#' + p.pid + '</span>' : '';

  // Tags
  var tags = (p.tags && p.tags.length > 0)
    ? '<div class="tag-row">' + p.tags.map(function(t) { return '<span class="tag ' + tagClass(t) + '">' + escHtml(t) + '</span>'; }).join('') + '</div>'
    : '';

  // Characters (extracted from @@.name; patterns)
  var chars = getPassageChars(p);
  var charsHtml = chars.length > 0
    ? '<div class="char-pills">' + chars.map(function(c) {
        var color = CHAR_COLORS[c] || '#64748b';
        return '<span class="char-pill" style="background:' + color + '18;color:' + color + ';border:1px solid ' + color + '33" onclick="filterByChar(\'' + c + '\')">' + c + '</span>';
      }).join('') + '</div>'
    : '';

  // Condition tags
  var condHtml = '';
  if (showCond) {
    var conds = extractConditions(p.content || '');
    if (conds.length > 0) {
      condHtml = '<div class="tag-row">' + conds.slice(0, 5).map(function(c) {
        return '<span class="tag tag-cond" title="' + escHtml(c) + '">' + escHtml(c.length > 30 ? c.substring(0, 27) + '...' : c) + '</span>';
      }).join('') + '</div>';
    }
  }

  // Text
  var TEXT_LIMIT = 5000;
  var textHtml = '';
  if (showZh && p.content_zh) {
    var t = p.content_zh.length > TEXT_LIMIT ? p.content_zh.substring(0, TEXT_LIMIT) : p.content_zh;
    var trunc = p.content_zh.length > TEXT_LIMIT ? '<div style="color:var(--tag-cond);font-size:11px;margin-top:4px">... 已截斷 (' + (p.content_zh.length/1000).toFixed(0) + 'K)</div>' : '';
    textHtml += '<div class="text">' + formatText(t) + '</div>' + trunc;
  }
  if (showEn && p.content) {
    var t = p.content.length > TEXT_LIMIT ? p.content.substring(0, TEXT_LIMIT) : p.content;
    var trunc = p.content.length > TEXT_LIMIT ? '<div style="color:var(--tag-cond);font-size:11px;margin-top:4px">... truncated (' + (p.content.length/1000).toFixed(0) + 'K)</div>' : '';
    if (showZh && p.content_zh) {
      var isLong = t.length > 300;
      textHtml += '<div class="text-en' + (isLong ? ' collapsed' : '') + '">' + formatText(t) + '</div>' + trunc;
    } else {
      textHtml += '<div class="text">' + formatText(t) + '</div>' + trunc;
    }
  }
  if (!textHtml) {
    textHtml = p.content_zh
      ? '<div class="text">' + formatText(p.content_zh.length > TEXT_LIMIT ? p.content_zh.substring(0, TEXT_LIMIT) : p.content_zh) + '</div>'
      : p.content
        ? '<div class="text">' + formatText(p.content.length > TEXT_LIMIT ? p.content.substring(0, TEXT_LIMIT) : p.content) + '</div>'
        : '<div class="text" style="color:var(--text3)">(empty)</div>';
  }

  // Choices (extracted from [[link]] syntax)
  var choices = extractChoices(p.content || '');
  var choicesHtml = '';
  if (showChoices && choices.length > 0) {
    var shown = choices.slice(0, 20);
    var overflow = choices.length > 20 ? '<span style="font-size:11px;color:var(--text2)">+' + (choices.length - 20) + ' 更多</span>' : '';
    choicesHtml = '<div class="choices-row">' + shown.map(function(c) {
      return '<span class="choice-btn" title="-> ' + escHtml(c.target) + '">' + escHtml(c.text) + '</span>';
    }).join('') + overflow + '</div>';
  }

  return '<div class="passage">' +
    '<div class="passage-header">' +
      '<span class="passage-title">' + escHtml(title) + '</span>' +
      pid +
    '</div>' +
    tags + condHtml + charsHtml + textHtml + choicesHtml +
  '</div>';
}

// === Chunked Rendering ===
function renderChunked(container, passages, startIdx) {
  var end = Math.min(startIdx + CHUNK_SIZE, passages.length);
  var html = '';
  for (var i = startIdx; i < end; i++) {
    html += passageHtml(passages[i]);
  }
  container.insertAdjacentHTML('beforeend', html);

  if (end < passages.length) {
    var sentinel = document.createElement('div');
    sentinel.className = 'loading';
    sentinel.style.padding = '16px';
    sentinel.innerHTML = '<div style="font-size:11px;color:var(--text3)">載入更多 (' + end + '/' + passages.length + ')...</div>';
    container.appendChild(sentinel);

    var obs = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        obs.disconnect();
        sentinel.remove();
        renderChunked(container, passages, end);
      }
    });
    obs.observe(sentinel);
  }
}

// === Narrative View (by group) ===
function renderNarrativeView(passages) {
  var content = document.getElementById('content');
  content.innerHTML = '';
  var groups = groupPassages(passages);

  if (groups.length === 0) {
    content.innerHTML = '<div class="empty-state">未找到匹配的段落</div>';
    return;
  }

  groups.forEach(function(entry) {
    var gName = entry[0], gPassages = entry[1];
    var isOpen = openSections.has('g:' + gName);
    var iconInfo = GROUP_ICONS[gName] || ['#64748b', gName.substring(0, 3).toUpperCase(), gName, ''];
    var charCount = new Set(gPassages.flatMap(function(p) { return getPassageChars(p); })).size;

    var header = document.createElement('div');
    header.className = 'group-header';
    header.innerHTML =
      '<div class="group-icon" style="background:' + iconInfo[0] + '22;color:' + iconInfo[0] + '">' + iconInfo[1] + '</div>' +
      '<span class="group-arrow' + (isOpen ? ' open' : '') + '">&#9654;</span>' +
      '<div class="group-info">' +
        '<h2>' + escHtml(iconInfo[2]) + '</h2>' +
        '<div class="group-name-en">' + escHtml(iconInfo[3] || gName) + '</div>' +
      '</div>' +
      '<div class="group-stats">' +
        (charCount > 0 ? '<span>' + charCount + ' 角色</span>' : '') +
        '<span><b>' + gPassages.length + '</b> 段落</span>' +
      '</div>';

    var body = document.createElement('div');
    body.className = 'group-body' + (isOpen ? ' open' : '');

    header.addEventListener('click', function() {
      var nowOpen = body.classList.toggle('open');
      header.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add('g:' + gName);
        if (!body.dataset.rendered) {
          renderChunked(body, gPassages, 0);
          body.dataset.rendered = '1';
        }
      } else {
        openSections.delete('g:' + gName);
      }
    });

    if (isOpen && !body.dataset.rendered) {
      renderChunked(body, gPassages, 0);
      body.dataset.rendered = '1';
    }

    content.appendChild(header);
    content.appendChild(body);
  });
}

function groupPassages(passages) {
  var groups = new Map();
  passages.forEach(function(p) {
    var g = p.group || '(uncategorized)';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(p);
  });
  if (DATA.groups && DATA.groups.length > 0) {
    var ordered = [];
    var seen = new Set();
    DATA.groups.forEach(function(gi) {
      var key = gi.id || gi.name;
      if (groups.has(key)) { ordered.push([key, groups.get(key)]); seen.add(key); }
    });
    groups.forEach(function(v, k) { if (!seen.has(k)) ordered.push([k, v]); });
    return ordered;
  }
  return Array.from(groups.entries()).sort(function(a, b) { return b[1].length - a[1].length; });
}

// === Scene View (group -> character sub-groups) ===
function renderSceneView(passages) {
  var content = document.getElementById('content');
  content.innerHTML = '';

  if (passages.length === 0) {
    content.innerHTML = '<div class="empty-state">未找到匹配的段落</div>';
    return;
  }

  var groups = groupPassages(passages);

  groups.forEach(function(entry) {
    var gName = entry[0], gPassages = entry[1];
    var iconInfo = GROUP_ICONS[gName] || ['#64748b', gName.substring(0, 3).toUpperCase(), gName, ''];
    var isOpen = openSections.has('sv:' + gName);

    // Sub-group by primary character
    var charSubs = new Map();
    gPassages.forEach(function(p) {
      var chars = getPassageChars(p);
      var key = chars.length > 0 ? chars[0] : '(general)';
      if (!charSubs.has(key)) charSubs.set(key, []);
      charSubs.get(key).push(p);
    });
    var subCount = charSubs.size;

    var header = document.createElement('div');
    header.className = 'group-header';
    header.style.background = 'linear-gradient(135deg, ' + iconInfo[0] + '15, var(--bg2))';
    header.innerHTML =
      '<div class="group-icon" style="background:' + iconInfo[0] + '22;color:' + iconInfo[0] + '">' + iconInfo[1] + '</div>' +
      '<span class="group-arrow' + (isOpen ? ' open' : '') + '">&#9654;</span>' +
      '<div class="group-info">' +
        '<h2>' + escHtml(iconInfo[2]) + '</h2>' +
        '<div class="group-name-en">' + escHtml(iconInfo[3] || gName) + ' &middot; ' + subCount + ' 子場景</div>' +
      '</div>' +
      '<div class="group-stats"><b>' + gPassages.length + '</b> 段落</div>';

    var body = document.createElement('div');
    body.className = 'group-body' + (isOpen ? ' open' : '');

    header.addEventListener('click', function() {
      var nowOpen = body.classList.toggle('open');
      header.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add('sv:' + gName);
        if (!body.dataset.rendered) {
          renderSceneSubs(body, charSubs, gName);
          body.dataset.rendered = '1';
        }
      } else {
        openSections.delete('sv:' + gName);
      }
    });

    if (isOpen && !body.dataset.rendered) {
      renderSceneSubs(body, charSubs, gName);
      body.dataset.rendered = '1';
    }

    content.appendChild(header);
    content.appendChild(body);
  });
}

function renderSceneSubs(container, charSubs, groupName) {
  var sorted = Array.from(charSubs.entries()).sort(function(a, b) {
    if (a[0] === '(general)') return 1;
    if (b[0] === '(general)') return -1;
    return b[1].length - a[1].length;
  });

  sorted.forEach(function(entry) {
    var charName = entry[0], subPassages = entry[1];
    var secKey = 'ss:' + groupName + ':' + charName;
    var isOpen = openSections.has(secKey);
    var color = CHAR_COLORS[charName] || '#64748b';
    var isGeneral = charName === '(general)';

    var sub = document.createElement('div');
    sub.className = 'char-section';
    sub.style.margin = '4px 0';
    sub.innerHTML =
      '<div class="char-section-header" style="padding:10px 14px">' +
        '<div class="char-section-avatar" style="background:' + color + ';width:32px;height:32px;font-size:13px">' +
          (isGeneral ? '?' : charName[0]) +
        '</div>' +
        '<div class="char-section-info">' +
          '<h3 style="font-size:14px">' + (isGeneral ? '一般場景' : escHtml(charName)) + '</h3>' +
          '<div class="meta">' + subPassages.length + ' 段落</div>' +
        '</div>' +
        '<span class="group-arrow' + (isOpen ? ' open' : '') + '">&#9654;</span>' +
      '</div>';

    var subBody = document.createElement('div');
    subBody.className = 'char-section-body' + (isOpen ? ' open' : '');

    sub.querySelector('.char-section-header').addEventListener('click', function() {
      var nowOpen = subBody.classList.toggle('open');
      sub.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add(secKey);
        if (!subBody.dataset.rendered) {
          renderChunked(subBody, subPassages, 0);
          subBody.dataset.rendered = '1';
        }
      } else {
        openSections.delete(secKey);
      }
    });

    if (isOpen && !subBody.dataset.rendered) {
      renderChunked(subBody, subPassages, 0);
      subBody.dataset.rendered = '1';
    }

    sub.appendChild(subBody);
    container.appendChild(sub);
  });
}

// === Character View ===
function renderCharacterView(passages) {
  var content = document.getElementById('content');
  content.innerHTML = '';

  // Group by character
  var charMap = new Map();
  passages.forEach(function(p) {
    getPassageChars(p).forEach(function(c) {
      if (!charMap.has(c)) charMap.set(c, []);
      charMap.get(c).push(p);
    });
  });

  // No-character passages
  var noChar = passages.filter(function(p) { return getPassageChars(p).length === 0; });

  if (charMap.size === 0 && noChar.length === 0) {
    content.innerHTML = '<div class="empty-state">未找到匹配的段落</div>';
    return;
  }

  var sorted = Array.from(charMap.entries()).sort(function(a, b) { return b[1].length - a[1].length; });

  sorted.forEach(function(entry) {
    var charName = entry[0], charPassages = entry[1];
    if (charFilter && charFilter !== charName) return;

    var isOpen = openSections.has('c:' + charName);
    var color = CHAR_COLORS[charName] || '#64748b';
    var groupCounts = {};
    charPassages.forEach(function(p) {
      var g = p.group || 'other';
      var gInfo = GROUP_ICONS[g];
      var label = gInfo ? gInfo[2] : g;
      groupCounts[label] = (groupCounts[label] || 0) + 1;
    });
    var groupStr = Object.entries(groupCounts).map(function(e) { return e[0] + ' ' + e[1]; }).join(' / ');

    var section = document.createElement('div');
    section.className = 'char-section';
    section.innerHTML =
      '<div class="char-section-header">' +
        '<div class="char-section-avatar" style="background:' + color + '">' + charName[0] + '</div>' +
        '<div class="char-section-info">' +
          '<h3>' + escHtml(charName) + '</h3>' +
          '<div class="meta">' + charPassages.length + ' 段落 | ' + groupStr + '</div>' +
        '</div>' +
        '<span class="group-arrow' + (isOpen ? ' open' : '') + '">&#9654;</span>' +
      '</div>';

    var body = document.createElement('div');
    body.className = 'char-section-body' + (isOpen ? ' open' : '');

    section.querySelector('.char-section-header').addEventListener('click', function() {
      var nowOpen = body.classList.toggle('open');
      section.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add('c:' + charName);
        if (!body.dataset.rendered) {
          renderChunked(body, charPassages, 0);
          body.dataset.rendered = '1';
        }
      } else {
        openSections.delete('c:' + charName);
      }
    });

    if (isOpen && !body.dataset.rendered) {
      renderChunked(body, charPassages, 0);
      body.dataset.rendered = '1';
    }

    section.appendChild(body);
    content.appendChild(section);
  });

  // No-character section
  if (noChar.length > 0 && !charFilter) {
    var isOpen = openSections.has('c:__none');
    var section = document.createElement('div');
    section.className = 'char-section';
    section.innerHTML =
      '<div class="char-section-header">' +
        '<div class="char-section-avatar" style="background:var(--text3)">?</div>' +
        '<div class="char-section-info">' +
          '<h3>無特定角色</h3>' +
          '<div class="meta">' + noChar.length + ' 段落</div>' +
        '</div>' +
        '<span class="group-arrow' + (isOpen ? ' open' : '') + '">&#9654;</span>' +
      '</div>';
    var body = document.createElement('div');
    body.className = 'char-section-body' + (isOpen ? ' open' : '');

    section.querySelector('.char-section-header').addEventListener('click', function() {
      var nowOpen = body.classList.toggle('open');
      section.querySelector('.group-arrow').classList.toggle('open', nowOpen);
      if (nowOpen) {
        openSections.add('c:__none');
        if (!body.dataset.rendered) {
          renderChunked(body, noChar, 0);
          body.dataset.rendered = '1';
        }
      } else {
        openSections.delete('c:__none');
      }
    });
    if (isOpen && !body.dataset.rendered) {
      renderChunked(body, noChar, 0);
      body.dataset.rendered = '1';
    }
    section.appendChild(body);
    content.appendChild(section);
  }
}

// === Render Dispatch ===
function resetAndRender() {
  var passages = getFiltered();
  switch (currentView) {
    case 'narrative': renderNarrativeView(passages); break;
    case 'scene': renderSceneView(passages); break;
    case 'character': renderCharacterView(passages); break;
  }
}

function setActiveView(view) {
  currentView = view;
  openSections.clear();
  document.querySelectorAll('.view-btn').forEach(function(b) { b.classList.remove('active'); });
  var btnId = view === 'narrative' ? 'viewNarrative' : view === 'scene' ? 'viewScene' : 'viewChar';
  document.getElementById(btnId).classList.add('active');
  updateFilterBar();
  resetAndRender();
}

// === Init ===
function init() {
  renderBanner();
  updateFilterBar();

  var searchTimeout;
  document.getElementById('searchBox').addEventListener('input', function(e) {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function() {
      searchQuery = e.target.value.trim();
      openSections.clear();
      resetAndRender();
    }, 300);
  });

  document.getElementById('showZh').addEventListener('change', function(e) { showZh = e.target.checked; openSections.clear(); resetAndRender(); });
  document.getElementById('showEn').addEventListener('change', function(e) { showEn = e.target.checked; openSections.clear(); resetAndRender(); });
  document.getElementById('showChoices').addEventListener('change', function(e) { showChoices = e.target.checked; openSections.clear(); resetAndRender(); });
  document.getElementById('showCond').addEventListener('change', function(e) { showCond = e.target.checked; openSections.clear(); resetAndRender(); });

  document.getElementById('viewNarrative').addEventListener('click', function() { setActiveView('narrative'); });
  document.getElementById('viewScene').addEventListener('click', function() { setActiveView('scene'); });
  document.getElementById('viewChar').addEventListener('click', function() { setActiveView('character'); });

  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === '/') { e.preventDefault(); document.getElementById('searchBox').focus(); }
    if (e.key === '1') setActiveView('narrative');
    if (e.key === '2') setActiveView('scene');
    if (e.key === '3') setActiveView('character');
    if (e.key === 'Escape') {
      document.getElementById('searchBox').blur();
      if (charFilter) { charFilter = null; updateFilterBar(); renderBanner(); resetAndRender(); }
    }
  });

  resetAndRender();
}

loadData();
</script>
</body>
</html>
